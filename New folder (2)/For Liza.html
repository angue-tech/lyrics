<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>For Liza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>

  :root {
    color-scheme: light;
    --paper: #f7f4f2;
    --ink: #2a1a1f;
    --ink-soft: #9a8a8e;
    --crimson: #c1002f;
    --crimson-deep: #a80028;
    --blush: #f7c6d0;
    --petal: #ffb6cb;
    --display: "Playfair Display", Georgia, "Times New Roman", serif;
    --hand: "Caveat", "Segoe Script", cursive;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--display); overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  .app {
    position: fixed; inset: 0; overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  .grid-bg {
    position: absolute; inset: 0; opacity: .5; pointer-events: none;
    background-image: linear-gradient(rgba(193,0,47,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(193,0,47,.05) 1px, transparent 1px);
    background-size: 36px 36px;
  }
  .pink-bg {
    position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 40%, #fff4f6 0%, #ffe3ea 55%, #ffd0dc 100%);
  }
  body.pink .pink-bg { opacity: 1; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity 1.4s ease; }
  body.pink #fx { opacity: 1; }
  #parts { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .pt { position: absolute; bottom: -40px; will-change: transform, opacity; animation: rise linear forwards; }
  @keyframes rise {
    0% { transform: translate3d(0, 0, 0) rotate(0deg) scale(.6); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translate3d(var(--dx), -115vh, 0) rotate(var(--rot)) scale(1); opacity: 0; }
  }

  .scene {
    position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .9s ease, visibility 0s .9s;
    display: flex; flex-direction: column; align-items: center;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  .scene.on { opacity: 1; visibility: visible; transition: opacity .9s ease, visibility 0s; }

  
  .head { text-align: center; padding-top: 7vh; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .eyebrow { font-size: 11px; letter-spacing: .42em; text-transform: lowercase; color: var(--ink-soft); font-style: italic; padding-left: .42em; }
  .title {
    margin: 0; font-weight: 700; font-size: clamp(22px, 6.4vw, 30px); color: var(--crimson); text-wrap: balance;
    padding: 4px 16px 6px; border-radius: 8px; background: linear-gradient(transparent 0%, rgba(247,198,208,.65) 0%, rgba(247,198,208,.65) 100%);
    box-shadow: 0 0 22px 6px rgba(247,198,208,.55);
  }
  .sub { font-style: italic; font-size: clamp(16px, 4.6vw, 19px); margin: 6px 0 0; }
  .stage { position: relative; flex: 1; width: 100%; max-width: 560px; }
  .board { position: absolute; left: 50%; top: 46%; width: min(66vw, 300px); aspect-ratio: 200 / 180; transform: translate(-50%, -50%); }
  .board .slot { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .board .whole { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .6s ease; pointer-events: none; overflow: visible; }
  .board.done .whole { opacity: 1; }
  .piece {
    position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;
    transform: translate(var(--x, 0px), var(--y, 0px)) rotate(var(--r, 0deg));
    transition: transform .45s cubic-bezier(.2, .9, .3, 1.15);
    filter: drop-shadow(0 6px 10px rgba(193,0,47,.32));
    will-change: transform;
  }
  .piece.drag { transition: none; filter: drop-shadow(0 12px 16px rgba(193,0,47,.4)); z-index: 4; }
  .piece.grab { transition: transform .0s; }
  .piece .hit { pointer-events: all; cursor: grab; }
  .piece.locked { pointer-events: none; z-index: 1; filter: drop-shadow(0 2px 3px rgba(193,0,47,.28)); animation: pop .5s ease; }
  .piece.locked .hit { pointer-events: none; }
  @keyframes pop { 0% { scale: 1; } 40% { scale: 1.06; } 100% { scale: 1; } }
  .hint { position: absolute; bottom: 4vh; left: 0; right: 0; text-align: center; font-size: 10px; letter-spacing: .3em; text-transform: lowercase; color: #c9bcc0; font-style: italic; }


  #s-reveal { justify-content: center; }
  .bigheart { width: min(60vw, 280px); animation: beat 1.1s ease-in-out 2, grow 1.6s cubic-bezier(.7, 0, .9, .4) 2.2s forwards; filter: drop-shadow(0 10px 24px rgba(193,0,47,.35)); }
  @keyframes beat { 0%, 100% { transform: scale(1); } 25% { transform: scale(1.14); } 45% { transform: scale(.98); } 65% { transform: scale(1.08); } }
  @keyframes grow { to { transform: scale(22); opacity: 1; } }


  #s-bloom { justify-content: center; text-align: center; gap: 10px; }
  .for { font-size: 12px; letter-spacing: .4em; color: var(--crimson); font-style: italic; padding-left: .4em; }
  .name { font-family: var(--hand); font-size: clamp(64px, 22vw, 110px); color: var(--crimson); font-weight: 600; line-height: 1; text-shadow: 0 2px 18px rgba(255,255,255,.9); }


  #s-lines { justify-content: center; }
  .line { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); padding: 0 max(36px, env(safe-area-inset-left, 0px)); text-align: center; font-size: clamp(26px, 8vw, 40px); line-height: 1.25; text-wrap: balance; font-weight: 500; }
  .line .w { display: inline-block; opacity: 0; color: #b9aeb1; transform: translateY(6px); transition: opacity .6s ease, transform .6s ease, color 1.2s ease .3s; white-space: pre; }
  .line .w.in { opacity: 1; transform: none; color: var(--ink); }
  .line.out { opacity: 0; transition: opacity .7s ease; }

  
  .polaroid {
    position: absolute; width: min(42vw, 190px); background: #fff; padding: 8px 8px 10px; box-sizing: border-box;
    box-shadow: 0 10px 24px rgba(120,20,50,.22); border-radius: 2px; opacity: 0;
    transform: translateY(40px) rotate(var(--rot)) scale(.9); transition: opacity .9s ease, transform 1.1s cubic-bezier(.2, .8, .2, 1);
  }
  .polaroid.in { opacity: 1; transform: translateY(0) rotate(var(--rot)); animation: bob 5s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
  .polaroid .ph { aspect-ratio: 4 / 5; background: linear-gradient(145deg, #ffe3ea, #f9c3d1); background-size: cover; background-position: center; display: grid; place-items: center; color: #d56a88; font-size: 11px; font-style: italic; text-align: center; padding: 8px; }
  .polaroid .cap { font-family: var(--hand); font-size: 22px; color: var(--crimson); text-align: center; padding-top: 4px; line-height: 1.1; }
  .polaroid::before { content: ""; position: absolute; top: -9px; left: 50%; width: 52px; height: 18px; margin-left: -26px; background: rgba(247,198,208,.8); transform: rotate(-3deg); }
  .pol-stage { position: relative; flex: 1; width: 100%; max-width: 560px; }

 
  #s-end { justify-content: center; text-align: center; gap: 6px; }
  .end-small { font-style: italic; font-size: 14px; letter-spacing: .08em; color: var(--ink-soft); }
  .end-big { font-size: clamp(30px, 9vw, 46px); font-weight: 700; color: var(--crimson); margin: 4px 0 0; text-wrap: balance; }
  .end-heart { width: 74px; margin: 18px 0 14px; animation: beat 1.6s ease-in-out infinite; filter: drop-shadow(0 6px 12px rgba(193,0,47,.3)); }
  button.replay {
    font: italic 500 16px var(--display); color: var(--crimson); background: rgba(255,255,255,.7); border: 1.5px solid var(--crimson);
    border-radius: 999px; padding: 10px 26px; cursor: pointer; touch-action: manipulation;
  }
  button.replay:hover { background: var(--crimson); color: #fff; }
  button:focus-visible { outline: 3px solid rgba(193,0,47,.45); outline-offset: 3px; }

  #mute {
    position: absolute; z-index: 9; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(14px, env(safe-area-inset-right, 0px));
    width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.75); color: var(--crimson);
    display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 8px rgba(120,20,50,.18);
  }
  #mute svg { width: 18px; height: 18px; }
  #mute .off { display: none; }
  #mute.muted .on { display: none; }
  #mute.muted .off { display: block; }

  @media (prefers-reduced-motion: reduce) {
    .bigheart { animation: grow 1s ease 1s forwards; }
    .end-heart, .polaroid.in { animation: none; }
    .pt { animation-duration: 0s !important; display: none; }
  }
</style>

<div class="app" id="app">
  <div class="grid-bg"></div>
  <div class="pink-bg"></div>
  <canvas id="fx"></canvas>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <clipPath id="heartClip"><path id="heartPath" d="M100 172 C 20 110, 2 70, 2 48 C 2 22, 22 4, 48 4 C 70 4, 90 16, 100 36 C 110 16, 130 4, 152 4 C 178 4, 198 22, 198 48 C 198 70, 180 110, 100 172 Z"/></clipPath>
      <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="180"><stop offset="0" stop-color="#d8143f"/><stop offset="1" stop-color="#a80028"/></linearGradient>
    </defs>
  </svg>

  <!-- 1 puzzle -->
  <section class="scene on" id="s-puzzle" aria-label="Puzzle">
    <div class="head">
      <p class="sub">put us back together, babyy</p>
    </div>
    <div class="stage" id="stage">
      <div class="board" id="board">
        <svg class="slot" viewBox="0 0 200 180" aria-hidden="true">
          <path d="M100 172 C 20 110, 2 70, 2 48 C 2 22, 22 4, 48 4 C 70 4, 90 16, 100 36 C 110 16, 130 4, 152 4 C 178 4, 198 22, 198 48 C 198 70, 180 110, 100 172 Z" fill="rgba(0,0,0,.025)" stroke="rgba(193,0,47,.22)" stroke-width="1.2" stroke-dasharray="4 4"/>
          <path d="M100 4 V172 M2 88 H198" stroke="rgba(0,0,0,.08)" stroke-width="1" fill="none"/>
        </svg>
        <svg class="whole" viewBox="0 0 200 180" aria-hidden="true"><path d="M100 172 C 20 110, 2 70, 2 48 C 2 22, 22 4, 48 4 C 70 4, 90 16, 100 36 C 110 16, 130 4, 152 4 C 178 4, 198 22, 198 48 C 198 70, 180 110, 100 172 Z" fill="url(#g)"/></svg>
      </div>
    </div>
    <div class="hint">drag each piece into place</div>
  </section>


  <section class="scene" id="s-reveal" aria-hidden="true">
    <svg class="bigheart" viewBox="0 0 200 180"><path d="M100 172 C 20 110, 2 70, 2 48 C 2 22, 22 4, 48 4 C 70 4, 90 16, 100 36 C 110 16, 130 4, 152 4 C 178 4, 198 22, 198 48 C 198 70, 180 110, 100 172 Z" fill="url(#g)"/></svg>
  </section>


  <section class="scene" id="s-bloom" aria-hidden="true">
    <div class="for" id="forText">this one is for you</div>
    <div class="name" id="nameText">Liza</div>
  </section>


  <section class="scene" id="s-lines" aria-hidden="true"></section>

 
  <section class="scene" id="s-photos" aria-hidden="true">
    <div class="pol-stage" id="polStage"></div>
  </section>


  <section class="scene" id="s-end" aria-hidden="true">
    <h2 class="end-big" id="endBig">I love you, liza</h2>
    <svg class="end-heart" viewBox="0 0 200 180"><path d="M100 172 C 20 110, 2 70, 2 48 C 2 22, 22 4, 48 4 C 70 4, 90 16, 100 36 C 110 16, 130 4, 152 4 C 178 4, 198 22, 198 48 C 198 70, 180 110, 100 172 Z" fill="url(#g)"/></svg>
    <button class="replay" id="replay" type="button">play again</button>
  </section>

  <div id="parts"></div>

  <button id="mute" type="button" aria-label="Toggle music" class="muted">
    <svg class="on" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6l10-2v12.2A3.5 3.5 0 1 1 17 13V7.1L11 8.3V18a3 3 0 1 1-2-2.83Z"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V6l10-2v6"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><path d="M3 3l18 18"/></svg>
  </button>
</div>

const $ = (s) => document.querySelector(s);

/* ===== Music ===== */
let musicUnlocked = false;
function playMusic() {
  if (!wantMusic || !musicUnlocked) return;
  const p = bgm.play();
  if (p && p.then) p.then(() => muteBtn.classList.remove("muted")).catch(() => {});
}

  e.stopPropagation();

});


function show(id) {
  document.querySelectorAll(".scene").forEach((s) => {
    const on = s.id === id;
    s.classList.toggle("on", on);
    s.setAttribute("aria-hidden", on ? "false" : "true");
  });
}

const SHAPES = [
  '<svg width="%s" height="%s" viewBox="0 0 200 180"><path d="M100 172 C 20 110, 2 70, 2 48 C 2 22, 22 4, 48 4 C 70 4, 90 16, 100 36 C 110 16, 130 4, 152 4 C 178 4, 198 22, 198 48 C 198 70, 180 110, 100 172 Z" fill="#c1002f"/><ellipse cx="58" cy="44" rx="16" ry="9" fill="rgba(255,255,255,.35)" transform="rotate(-30 58 44)"/></svg>',
  '<svg width="%s" height="%s" viewBox="0 0 24 24"><path d="M12 0 L14.6 9.4 L24 12 L14.6 14.6 L12 24 L9.4 14.6 L0 12 L9.4 9.4Z" fill="#c1002f"/></svg>',

  '<svg width="%s" height="%s" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#e0607e"/></svg>'
];
let partsOn = false, partsTimer = null;
function spawn() {
  if (!partsOn || document.hidden) return;
  const el = document.createElement("div");
  el.className = "pt";
  const k = Math.random();
  const idx = k < 0.38 ? 0 : k < 0.62 ? 1 : k < 0.8 ? 2 : 3;
  const size = idx === 0 ? 14 + Math.random() * 30 : idx === 3 ? 5 + Math.random() * 6 : 8 + Math.random() * 16;
  el.innerHTML = SHAPES[idx].replace(/%s/g, size.toFixed(0));
  const edge = Math.random() < 0.75;
  const x = edge ? (Math.random() < 0.5 ? Math.random() * 16 : 84 + Math.random() * 16) : Math.random() * 100;
  el.style.left = x + "%";
  el.style.setProperty("--dx", ((Math.random() - 0.5) * 80).toFixed(0) + "px");
  el.style.setProperty("--rot", ((Math.random() - 0.5) * 120).toFixed(0) + "deg");
  el.style.animationDuration = (7 + Math.random() * 6).toFixed(1) + "s";
  $("#parts").appendChild(el);
  setTimeout(() => el.remove(), 14000);
}
function setParts(on) {
  partsOn = on;
  if (on && !partsTimer) {
    for (let i = 0; i < 7; i++) setTimeout(spawn, i * 160);
    partsTimer = setInterval(spawn, 520);
  }
  if (!on && partsTimer) { clearInterval(partsTimer); partsTimer = null; }
}


const cv = $("#fx"), ctx = cv.getContext("2d");
let flowers = [], density = 1, W = 0, H = 0, dpr = 1;
function sizeCanvas() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function makeFlower(initial) {
  return {
    x: Math.random() * W, y: initial ? Math.random() * H : -40,
    s: 14 + Math.random() * 34, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.012,
    vy: 0.25 + Math.random() * 0.6, sw: Math.random() * 6.28, sa: 0.2 + Math.random() * 0.5,
    shade: Math.random()
  };
}
function drawFlower(f) {
  ctx.save();
  ctx.translate(f.x, f.y); ctx.rotate(f.r);
  const c1 = `hsl(${344 + f.shade * 10} ${80 + f.shade * 15}% ${86 - f.shade * 8}%)`;
  ctx.fillStyle = c1;
  ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    ctx.save(); ctx.rotate((i * Math.PI * 2) / 5);
    ctx.beginPath(); ctx.ellipse(0, -f.s * 0.52, f.s * 0.36, f.s * 0.52, 0, 0, 6.3); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = "#e3718f"; ctx.beginPath(); ctx.arc(0, 0, f.s * 0.12, 0, 6.3); ctx.fill();
  ctx.restore();
}
function frame() {
  ctx.clearRect(0, 0, W, H);
  const target = Math.round(((W * H) / 9000) * density);
  while (flowers.length < target) flowers.push(makeFlower(flowers.length < 1 || true));
  if (flowers.length > target) flowers.length = target;
  for (const f of flowers) {
    f.y += f.vy; f.sw += 0.012; f.x += Math.sin(f.sw) * f.sa; f.r += f.vr;
    if (f.y > H + 50) Object.assign(f, makeFlower(false));
    drawFlower(f);
  }
  requestAnimationFrame(frame);
}
function setBlossoms(mode) {
  if (mode === "off") { document.body.classList.remove("pink"); return; }
  density = mode === "dense" ? 1.15 : 0.32;
  document.body.classList.add("pink");
}

  if (dir === "r") { cx = a + off; cy = b; rx = a - 2; ry = b - nw / 2; rw = off; rh = nw; }
  if (dir === "l") { cx = a - off; cy = b; rx = a - off; ry = b - nw / 2; rw = off + 2; rh = nw; }
  if (dir === "d") { cx = b; cy = a + off; rx = b - nw / 2; ry = a - 2; rw = nw; rh = off; }
  if (dir === "u") { cx = b; cy = a - off; rx = b - nw / 2; ry = a - off; rw = nw; rh = off + 2; }
  return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${fill}"/><rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" fill="${fill}"/>`;
}
const PIECES = [
  { id: "tl", x: 0,   y: 0,  w: 100, h: 88, own: knob(100, 50, "r", "#fff"),  blank: knob(88, 50, "u", "#000"), ox: "25%", oy: "25%", slot: [0.2, 0.14],  r0: -24 },
  { id: "tr", x: 100, y: 0,  w: 100, h: 88, own: knob(88, 150, "d", "#fff"),  blank: knob(100, 50, "r", "#000"), ox: "75%", oy: "25%", slot: [0.82, 0.12], r0: 20 },
  { id: "bl", x: 0,   y: 88, w: 100, h: 92, own: knob(88, 50, "u", "#fff"),   blank: knob(100, 132, "l", "#000"), ox: "25%", oy: "72%", slot: [0.17, 0.8],  r0: 28 },
  { id: "br", x: 100, y: 88, w: 100, h: 92, own: knob(100, 132, "l", "#fff"), blank: knob(88, 150, "d", "#000"), ox: "75%", oy: "72%", slot: [0.83, 0.78], r0: -18 }
];
let pieceEls = [], solved = 0, puzzleOpen = true;

function buildPuzzle() {
  const board = $("#board");
  board.classList.remove("done");
  pieceEls.forEach((p) => p.remove());
  pieceEls = []; solved = 0; puzzleOpen = true;
  PIECES.forEach((p) => {
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 200 180");
    svg.setAttribute("class", "piece");
    svg.style.transformOrigin = `${p.ox} ${p.oy}`;
    svg.innerHTML = `
      <mask id="mk-${p.id}" maskUnits="userSpaceOnUse" x="-30" y="-30" width="260" height="240">
        <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" fill="#fff"/>
        ${p.own}${p.blank}
      </mask>
      <g clip-path="url(#heartClip)"><rect x="-30" y="-30" width="260" height="240" fill="url(#g)" mask="url(#mk-${p.id})"/></g>
      <rect class="hit" x="${p.x - 10}" y="${p.y - 10}" width="${p.w + 20}" height="${p.h + 20}" fill="transparent" clip-path="url(#heartClip)"/>`;
    svg.dataset.id = p.id;
    board.appendChild(svg);
    pieceEls.push(svg);
    svg._p = p;
    attachDrag(svg);
  });
  scatter();
}

function scatter() {
  const stage = $("#stage").getBoundingClientRect();
  const board = $("#board").getBoundingClientRect();
  const k = board.width / 200;
  pieceEls.forEach((el) => {
    if (el.classList.contains("locked")) return;
    const p = el._p;
    const homeX = board.left + (p.x + p.w / 2) * k, homeY = board.top + (p.y + p.h / 2) * k;
    const tx = stage.left + stage.width * p.slot[0], ty = stage.top + stage.height * p.slot[1];
    el._x = tx - homeX; el._y = ty - homeY; el._r = p.r0;
    apply(el);
  });
}
function apply(el) {
  el.style.setProperty("--x", el._x + "px");
  el.style.setProperty("--y", el._y + "px");
  el.style.setProperty("--r", el._r + "deg");
}

function attachDrag(el) {
  const hit = el.querySelector(".hit");
  let sx, sy, ox, oy, id = null;
  hit.addEventListener("pointerdown", (e) => {
    if (!puzzleOpen || el.classList.contains("locked")) return;
    e.preventDefault();
    id = e.pointerId; hit.setPointerCapture(id);
    sx = e.clientX; sy = e.clientY; ox = el._x; oy = el._y;
    el.classList.add("drag");
    el._r = 0; apply(el);
    el.style.transition = "transform .0s";
    el.style.zIndex = 6;
  });
  hit.addEventListener("pointermove", (e) => {
    if (id !== e.pointerId) return;
    el._x = ox + (e.clientX - sx); el._y = oy + (e.clientY - sy);
    apply(el);
  });
  const end = (e) => {
    if (id !== e.pointerId) return;
    id = null;
    el.classList.remove("drag");
    el.style.transition = "";
    el.style.zIndex = "";
    const k = $("#board").getBoundingClientRect().width / 200;
    const dist = Math.hypot(el._x, el._y);
    if (dist < Math.max(30, 34 * k * 0.6)) {
      el._x = 0; el._y = 0; el._r = 0; apply(el);
      el.classList.add("locked");
      if (navigator.vibrate) { try { navigator.vibrate(18); } catch (_) {} }
      solved++;
      if (solved === PIECES.length) finishPuzzle();
    } else {
      // keep where dropped, but clamp inside the stage so it can be grabbed again
      const stage = $("#stage").getBoundingClientRect();
      const board = $("#board").getBoundingClientRect();
      const p = el._p;
      const cx = board.left + (p.x + p.w / 2) * k + el._x, cy = board.top + (p.y + p.h / 2) * k + el._y;
      const minX = stage.left + 40, maxX = stage.right - 40, minY = stage.top + 30, maxY = stage.bottom - 30;
      el._x += Math.min(Math.max(cx, minX), maxX) - cx;
      el._y += Math.min(Math.max(cy, minY), maxY) - cy;
      apply(el);
    }
  };
  hit.addEventListener("pointerup", end);
  hit.addEventListener("pointercancel", end);
}

async function finishPuzzle() {
  puzzleOpen = false;
  const my = ++run;
  try {
    await wait(350, my);
    $("#board").classList.add("done");
    musicUnlocked = true; playMusic();
    await wait(900, my);
    sequence(my);
  } catch (_) {}
}

/* ===== Sequence after the puzzle ===== */
async function typeLine(text, my) {
  const scene = $("#s-lines");
  const el = document.createElement("div");
  el.className = "line";
  const words = text.split(" ");
  el.innerHTML = words.map((w, i) => `<span class="w">${w}${i < words.length - 1 ? " " : ""}</span>`).join("");
  scene.appendChild(el);
  await wait(60, my);
  const spans = el.querySelectorAll(".w");
  for (const s of spans) { s.classList.add("in"); await wait(reduced ? 80 : 380, my); }
  await wait(1900, my);
  el.classList.add("out");
  await wait(750, my);
  el.remove();
}

function buildPhotos() {
  const stage = $("#polStage");
  stage.innerHTML = "";
  const pos = [
    { left: "4%", top: "10%", rot: "-6deg", d: "0s" },
    { left: "30%", top: "38%", rot: "4deg", d: "1.2s" },
    { left: "auto", right: "3%", top: "6%", rot: "7deg", d: "2.2s" }
  ];
  CONFIG.photos.slice(0, 3).forEach((ph, i) => {
    const p = pos[i];
    const d = document.createElement("div");
    d.className = "polaroid";
    d.style.left = p.left; if (p.right) d.style.right = p.right; d.style.top = p.top;
    d.style.setProperty("--rot", p.rot); d.style.setProperty("--d", p.d);
    const img = document.createElement("div");
    img.className = "ph";
    if (ph.src) img.style.backgroundImage = `url("${ph.src}")`; else img.textContent = "your photo here";
    const cap = document.createElement("div");
    cap.className = "cap"; cap.textContent = ph.caption || "";
    d.append(img, cap);
    stage.appendChild(d);
  });
}

async function sequence(my) {
  try {
    
    show("s-reveal");
    setParts(false);
    await wait(reduced ? 1800 : 3700, my);
   
    setBlossoms("dense");
    $("#s-bloom").querySelector(".name").textContent = CONFIG.name;
    show("s-bloom");
    await wait(4200, my);
  
    setBlossoms("off");
    show("s-lines");
    setParts(true);
    $("#s-lines").innerHTML = "";
    for (const t of CONFIG.lines) await typeLine(t, my);
  
    setBlossoms("light");
    buildPhotos();
    show("s-photos");
    await wait(500, my);
    document.querySelectorAll(".polaroid").forEach((p, i) => setTimeout(() => p.classList.add("in"), i * 1100));
    await wait(10500, my);

    setBlossoms("off");
    $("#endBig").textContent = "I love you, " + CONFIG.name;
    show("s-end");
  } catch (_) { /* replay cancelled the run */ }
}

$("#replay").addEventListener("click", () => {
  run++;
  setParts(false);
  setBlossoms("off");
  $("#s-lines").innerHTML = "";
  show("s-puzzle");
  buildPuzzle();
});

sizeCanvas();
requestAnimationFrame(frame);
buildPuzzle();
addEventListener("resize", () => { if (puzzleOpen) scatter(); });
document.fonts && document.fonts.ready.then(() => { if (puzzleOpen) scatter(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) bgm.pause(); else if (wantMusic && !muteBtn.classList.contains("muted")) bgm.play().catch(() => {}); });
</script>
